<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="auth-card">
      <div class="card-icon">
        <img src="assets/icon-register.svg" alt="Register Icon" />
      </div>

      <h1 class="title">Sign up new account</h1>
      <p class="subtitle">Start your stellar journey</p>

      <form class="form">
        <div class="field">
          <span class="left-icon">
            <img src="assets/icon-user.svg" alt="User Icon" />
          </span>
          <input type="text" placeholder="Full Name" />
        </div>

        <div class="field">
          <span class="left-icon">
            <img src="assets/icon-mail.svg" alt="Email Icon" />
          </span>
          <input type="email" placeholder="Email" />
        </div>

        <div class="field">
          <span class="left-icon">
            <img src="assets/icon-lock.svg" alt="Password Icon" />
          </span>
          <input type="password" placeholder="Password" />
          <span class="right-icon">
            <img src="assets/icon-eye-off.svg" alt="Hide Password Icon" />
          </span>
        </div>

        <div class="field">
          <span class="left-icon">
            <img src="assets/icon-lock.svg" alt="Confirm Password Icon" />
          </span>
          <input type="password" placeholder="Confirm Password" />
          <span class="right-icon">
            <img src="assets/icon-eye-off.svg" alt="Hide Password Icon" />
          </span>
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>

        <div class="divider">Or Sign Up With</div>

        <div class="socials">
          <button type="button" class="social-btn">
            <img src="assets/logo-google.svg" alt="Google" />
          </button>
          <button type="button" class="social-btn">
            <img src="assets/logo-facebook.svg" alt="Facebook" />
          </button>
          <button type="button" class="social-btn">
            <img src="assets/logo-apple.svg" alt="Apple" />
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
